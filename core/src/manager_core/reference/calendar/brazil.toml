# Janelas reservadas do calendário brasileiro (aproximadas; refinadas quando as competições
# nacionais forem especificadas). Datas fixas valem para todos os anos; brazil-<ano>.toml
# acrescenta datas específicas de um ano (ex.: datas FIFA); janelas de Páscoa são calculadas.

[[windows]]
label = "copa-do-brasil"
name = "Copa do Brasil (fases iniciais)"
from = "02-18"
to = "05-31"

[[windows]]
label = "brasileirao"
name = "Brasileirão Séries A–D"
from = "03-28"
to = "12-06"

# Carnaval: sábado a quarta-feira de cinzas (Páscoa −50 a −46).
[[easter_windows]]
label = "carnaval"
name = "Carnaval"
offset_from = -50
offset_to = -46

# Segunda e terça de Carnaval: sem jogos estaduais (decisão do dono).
[[easter_windows]]
label = "carnaval-segunda-terca"
name = "Carnaval (segunda e terça)"
offset_from = -48
offset_to = -47
blocks = ["state"]

[[easter_windows]]
label = "semana-santa"
name = "Semana Santa"
offset_from = -3
offset_to = 0
