# Aposentadoria decidida pelo jogador (spec 004, decisão do dono; research R9).
# p = base(idade) x (fator de queda se o CA caiu no ano) x f(profissionalismo, ambição), até max.
# f = clamp(personality_start - personality_slope * (profissionalismo + ambição - 20), min, max)
format_version = 1
min_age = 30
decline_factor = 1.5
personality_start = 1.3
personality_slope = 0.03
personality_min = 0.6
personality_max = 1.4
max_probability = 0.95

