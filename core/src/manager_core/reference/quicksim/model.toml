# Quick-sim model parameters (spec 003, research R9). Fitted by core/tools/tune_quicksim.py
# against reference/calibration/quicksim-targets.toml; hand-set values are commented.
model_version = "0.1"

# R3, R5, R6: per side per minute unless noted.
[rates]
shot = 0.13
foul = 0.135
corner_per_shot = 0.25
corner_base = 0.02
penalty = 0.0013
own_goal_share = 0.03
yellow_per_foul = 0.19
direct_red_per_foul = 0.004

# R2, R3: rating differences are scaled per 5 points of the 1-20 attribute scale.
[strength]
attack = 0.35
control = 0.20
keeper = 0.25
xg_median = 0.06
xg_sigma = 1.0
xg_attack = 0.25

# R3, R6
[home]
shot = 1.18
possession = 0.04

# R4: the time trend rises linearly over 90 minutes.
[time]
trend_start = 0.85
trend_end = 1.15

# R4: game state.
[state]
chase = 0.25
exposed = 0.15
protect = 0.15
man_up = 0.20

# R5: booked-player caution (owner's pain point) and its defensive cost.
[caution]
enabled = true
foul = 0.5
card = 0.7
cost = 0.15

# R8: stoppage time, minutes (inclusive ranges).
[stoppage]
first = [1, 5]
second = [4, 10]

# R7: substitutions.
[subs]
halftime_chance = 0.35
windows = [[55, 65], [66, 75], [76, 85]]
max = 5
window_chance = 0.85
per_window = [1, 2]

# R7: scorers and assisters.
[scorers]
header_share = 0.2
header_defender_weight = 0.4
assist_share = 0.75

[scorers.line_weights]
goalkeeper = 0.0
defender = 0.12
midfielder = 0.35
attacking_mid = 0.7
forward = 1.0

# R11: shootout kick probability.
[shootout]
base = 0.752
taker = 0.012
composure = 0.008
keeper = 0.01
low = 0.55
high = 0.92
