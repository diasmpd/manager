# Opções táticas no modelo do FM26 (spec 006, research R1). Ids em inglês; rótulos em pt-BR.
# Fontes: página do FM26 "In Possession, Out of Possession", guia de instruções do FMScout e
# base de instruções do FM Sidekick (consultadas em 2026-10-03).
format_version = 1

# ---- mentalidade (7 níveis, efeito real: decisão do dono) ------------------------------------
[mentality]
label = "Mentalidade"
default = "balanced"
settings = ["very_defensive", "defensive", "cautious", "balanced", "positive", "attacking",
            "very_attacking"]
labels = ["Muito defensiva", "Defensiva", "Cautelosa", "Equilibrada", "Positiva", "Ofensiva",
          "Muito ofensiva"]

