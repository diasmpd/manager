# Contexto: atacar o lado mais fraco do adversário (por ponto de desequilíbrio 0-1).
[context]
flank_bonus = 0.04
# Cada ponto percentual de posse ganho pela tática aumenta a pressão (ataques) nesta fração.
possession_pressure = 0.02

# ---- interações (pedra-papel-tesoura): minha opção x opção do adversário -----------------------
[[interactions]]
note = "Linha alta contra contra-ataque: espaço nas costas"
own = { defensive_line = ["higher", "much_higher"] }
opponent = { attacking_transition = ["counter"] }
levers = { allow_quality = 1.10 }

[[interactions]]
note = "Pressão alta contra jogo direto: a pressão é pulada"
own = { line_of_engagement = ["high_press"] }
opponent = { passing_directness = ["more_direct", "much_more_direct"] }
levers = { allow_rate = 1.06 }

[[interactions]]
note = "Pressão alta contra saída curta sob pressão: mais erros do adversário"
own = { line_of_engagement = ["high_press"] }
opponent = { build_up_strategy = ["play_through_press"] }
levers = { shot_rate = 1.04, allow_rate = 0.97 }

[[interactions]]
note = "Bloco baixo contra chutes de longe: mais finalizações, de baixa qualidade"
own = { line_of_engagement = ["low_block"] }
opponent = { shots_from_distance = ["encouraged"] }
levers = { allow_rate = 1.05, allow_quality = 0.95 }

[[interactions]]
note = "Bloco baixo contra posse paciente: o adversário roda a bola sem achar espaço"
own = { line_of_engagement = ["low_block"] }
opponent = { attacking_transition = ["patient"] }
levers = { allow_quality = 0.95 }

[[interactions]]
note = "Contrapressão contra ritmo alto: bolas perdidas viram chances"
own = { defensive_transition = ["counter_press"] }
opponent = { tempo = ["higher"] }
levers = { shot_rate = 1.03 }

[[interactions]]
note = "Linha de impedimento contra infiltrações e lançamentos"
own = { defensive_line_behaviour = ["offside_trap"] }
opponent = { passing_directness = ["more_direct", "much_more_direct"] }
levers = { allow_quality = 1.05 }

[[interactions]]
note = "Cruzamentos altos contra bloco que disputa: menos efetivos"
own = { crossing_style = ["high"] }
opponent = { cross_engagement_low = ["contest"] }
levers = { chance_quality = 0.95 }
