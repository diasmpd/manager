# Efeitos táticos no quick sim (spec 006, research R2, R3): cada opção move "alavancas".
# Multiplicadores (1.0 = neutro); "possession" é aditivo (pontos percentuais).
# Direções da literatura (StatsBomb, PPDA, Lago et al.); tamanhos são estimativas limitadas
# (±15% por opção), ajustadas pela calibração e pelo teste de exploração (exploit check).
# Toda opção tem um custo (alavanca no sentido contrário).
format_version = 1

# Mentalidade: passos de -3 (muito defensiva) a +3 (muito ofensiva), por passo.
[mentality_step]
shot_rate = 0.06
allow_rate = 0.05
allow_quality = 0.025
possession = 1.0
foul_rate = -0.01

# ---- com a bola -------------------------------------------------------------------------------
[team.passing_directness]
much_shorter = { possession = 4.0, shot_rate = 0.95, chance_quality = 1.04, error_risk = 1.04 }
