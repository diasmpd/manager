# Funções (roles) do FM26: com a bola (ip) e sem a bola (oop), sem tarefas (spec 006, R1, R4).
# Para cada função: posições válidas, atributos-chave com pesos (aptidão para a função),
# instruções individuais travadas (locked: instrução = valor) e pequenos efeitos (levers).
# Fontes da lista: FM Sidekick, base de funções do FM26 (consultada em 2026-10-03).
format_version = 1

# Sugestões de formação sem a bola para cada formação com a bola (3 cada, como no FM26).
[oop_suggestions]
"4-4-2" = ["4-4-2", "4-4-2-low", "4-4-1-1"]
"4-3-3" = ["4-1-4-1", "4-5-1", "4-4-1-1"]
"4-2-3-1" = ["4-4-1-1", "4-5-1", "4-4-2"]
"3-5-2" = ["5-3-2", "5-4-1", "3-5-2"]
"5-3-2" = ["5-3-2", "5-4-1", "4-4-2-low"]
"4-1-4-1" = ["4-1-4-1", "4-5-1", "4-4-1-1"]
"4-5-1" = ["4-5-1", "4-1-4-1", "4-4-1-1"]
"4-4-1-1" = ["4-4-1-1", "4-4-2", "4-5-1"]
"5-4-1" = ["5-4-1", "5-3-2", "4-5-1"]
"4-4-2-low" = ["4-4-2-low", "4-4-2", "5-4-1"]
"3-4-3" = ["5-4-1", "3-4-3", "5-3-2"]
"4-3-1-2" = ["4-4-2", "4-4-1-1", "4-3-1-2"]

# Função padrão por posição (ip, oop).
[defaults]
GK = ["goalkeeper", "goalkeeper_oop"]
DC = ["centre_back", "centre_back_oop"]
DL = ["full_back", "full_back_oop"]
DR = ["full_back", "full_back_oop"]
WBL = ["wing_back", "wing_back_oop"]
WBR = ["wing_back", "wing_back_oop"]
DM = ["defensive_midfielder", "defensive_midfielder_oop"]
MC = ["central_midfielder", "central_midfielder_oop"]
ML = ["wide_midfielder", "wide_midfielder_oop"]
MR = ["wide_midfielder", "wide_midfielder_oop"]
AMC = ["attacking_midfielder", "attacking_midfielder_oop"]
AML = ["winger", "winger_oop"]
AMR = ["winger", "winger_oop"]
ST = ["centre_forward", "centre_forward_oop"]

# ---- goleiro ----------------------------------------------------------------------------------
[[roles]]
id = "goalkeeper"
phase = "ip"
label = "Goleiro"
positions = ["GK"]
key = { kicking = 1.0, throwing = 1.0, composure = 0.8, decisions = 0.8 }

[[roles]]
id = "ball_playing_goalkeeper"
phase = "ip"
label = "Goleiro construtor"
positions = ["GK"]
key = { passing = 1.0, first_touch = 0.8, composure = 1.0, vision = 0.8, kicking = 0.8 }
levers = { error_risk = 1.03, possession = 0.5 }

[[roles]]
id = "no_nonsense_goalkeeper"
phase = "ip"
label = "Goleiro sem firula"
positions = ["GK"]
key = { kicking = 1.0, handling = 0.8, concentration = 0.8 }
locked = { passing_risk = "fewer" }
levers = { error_risk = 0.97, possession = -0.5 }

[[roles]]
