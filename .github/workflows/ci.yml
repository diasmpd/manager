name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: core
    env:
      MANAGER_PERF_LIMIT_S: "4.0"  # shared runners are slower than the reference PC (SC-001)
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (includes the quick-sim PR calibration gate)
        run: pytest -q -m "not milestone"
