name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]  # the game is played on Windows (owner, 2026-10-03)
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: core
    env:
      # Budgets are enforced on the reference PC (Constitution, scale 1). Shared runners vary
      # wildly (a season measured 6.6 s and 19 s against ~2 s locally, mostly SQLite autosave
      # I/O), so CI only bounds gross regressions: scale 5.
      MANAGER_PERF_LIMIT_S: "10.0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (includes the quick-sim PR calibration gate)
        run: pytest -q -m "not milestone"
      - name: Install terminal UI (spec 005)
        working-directory: tui
        run: python -m pip install -e ".[dev]"
      - name: Terminal UI lint, types and tests
        working-directory: tui
        run: |
          ruff check .
          mypy
          pytest -q
      - name: Desktop client (spec 007) - fetch Godot
        working-directory: .
        shell: pwsh
        run: ./tools/setup_client.ps1 -NoShortcut
      - name: Desktop client (spec 007) - headless tests against the real core
        working-directory: .
        shell: pwsh
        run: |
          $env:MANAGER_PYTHON = (Get-Command python).Source
          $env:MANAGER_SAVES = Join-Path $env:RUNNER_TEMP "client-saves"
          ./tools/godot/godot_console.exe --headless --path client -s res://tests/run_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
