[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "manager-tui"
version = "0.1.0"
description = "Terminal UI for Manager (spec 005): play a career from the terminal"
requires-python = ">=3.12"
dependencies = ["manager-core", "textual>=8.2,<9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manager_tui = ["*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]  # pt-BR text; Textual class-level BINDINGS

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/manager_tui"]

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
